<text x="56.0" y="315.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">put(3) overflows: evict the list's TAIL — key 2, the least recently touched. Map +</text>
<text x="56.0" y="334.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">list each do what the other can't: O(1) lookup + O(1) reorder.</text>
